name: Build Aria AI 2.0 Debug APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          mkdir -p app
          if [ ! -s app/google-services.json ] && [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          value = os.environ["GOOGLE_SERVICES_JSON"].strip()
          try:
              json.loads(value)
          except json.JSONDecodeError:
              value = base64.b64decode(value, validate=True).decode("utf-8")
              json.loads(value)

          Path("app/google-services.json").write_text(value + "\n", encoding="utf-8")
          PY
          fi

          if [ ! -s app/google-services.json ]; then
            echo "::error::Missing app/google-services.json. Add it to the repository or create the GOOGLE_SERVICES_JSON Actions secret (raw JSON or base64)."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          rm -rf "$SDK_ROOT/cmdline-tools"
          mkdir -p "$SDK_ROOT/cmdline-tools"

          LATEST_ZIP=$(curl -fsSL https://developer.android.com/studio \
            | grep -oE 'commandlinetools-linux-[0-9]+_latest\.zip' \
            | sort -V | tail -n 1 || true)
          if [ -z "$LATEST_ZIP" ]; then
            LATEST_ZIP=$(curl -fsSL https://dl.google.com/android/repository/repository2-1.xml \
              | grep -oE 'commandlinetools-linux-[0-9]+_latest\.zip' \
              | sort -V | tail -n 1 || true)
          fi
          if [ -z "$LATEST_ZIP" ]; then
            LATEST_ZIP="commandlinetools-linux-13114758_latest.zip"
          fi

          echo "Installing Android command-line tools: $LATEST_ZIP"
          curl -fsSL "https://dl.google.com/android/repository/${LATEST_ZIP}" -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          rm -f /tmp/cmdline-tools.zip

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKMANAGER"

          { yes || true; } | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36.1" || true

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare Named Debug APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Aria-AI-2.0-Debug.apk

      - name: Upload Aria-AI-2.0-Debug.apk Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Aria-AI-2.0-Debug.apk
          path: Aria-AI-2.0-Debug.apk
          if-no-files-found: error
          retention-days: 30
